name: Deploy lead Worker

on:
  push:
    branches: [ "main" ]
    paths:
      - 'workers/leads/**'
      - '.github/workflows/deploy-leads.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, so two runs never race to create the D1 database.
concurrency:
  group: deploy-leads
  cancel-in-progress: false

jobs:
  # Secrets cannot be used in a job-level `if`, so check for the token here.
  token:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the lead Worker was not deployed. See workers/leads/README.md."
          fi

  deploy:
    needs: token
    if: needs.token.outputs.present == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/leads
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Optional: only needed when the token can see more than one account.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      D1_NAME: samsquared-leads

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/leads/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Migrations need the database to exist, and they cannot create it.
      # Western Europe is the closest D1 location to South Africa.
      - name: Make sure the D1 database exists
        run: |
          npx wrangler d1 list --json > "$RUNNER_TEMP/d1.json"
          if node -e 'const [file, name] = process.argv.slice(1); process.exit(require(file).some((db) => db.name === name) ? 0 : 1)' "$RUNNER_TEMP/d1.json" "$D1_NAME"; then
            echo "D1 database $D1_NAME already exists"
          else
            npx wrangler d1 create "$D1_NAME" --location weur
          fi

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy
        run: npx wrangler deploy
